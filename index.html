<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlz Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030704;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .tech-grid {
            background-image: linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .scanline {
            width: 100%;
            height: 100px;
            position: absolute;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(16, 185, 129, 0.08) 50%, rgba(255,255,255,0));
            pointer-events: none;
            animation: scan 8s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(105vh); }
        }
    </style>
</head>
<body class="tech-grid min-h-screen flex items-center justify-center p-6 relative">
    <div class="scanline"></div>

    <!-- Top-Left Developer Tag -->
    <div class="absolute top-6 left-6 md:top-8 md:left-8 flex items-center space-x-2 z-10">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-xs md:text-sm font-mono text-emerald-400 tracking-wider">Charlz GTAG Copy developer</span>
    </div>

    <div class="max-w-xl w-full bg-[#071109]/90 border border-emerald-500/30 rounded-2xl p-8 md:p-10 shadow-2xl backdrop-blur-md relative overflow-hidden">
        <!-- Glow effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Status Header -->
        <div class="flex items-center justify-between mb-8 pb-4 border-b border-emerald-500/20">
            <div class="flex items-center space-x-3">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-xs uppercase tracking-widest text-emerald-400 font-semibold">Security Overhaul Active</span>
            </div>
            <div class="text-xs text-emerald-600 font-mono">STATUS: LOCKED</div>
        </div>

        <!-- Core Statement -->
        <div class="my-6">
            <p class="text-xl md:text-2xl font-medium text-emerald-100 leading-relaxed tracking-wide">
                Website is going under changes, we are tightening our security, so our passwords dont get pulled (like the last time)
            </p>
        </div>
    </div>
</body>
</html>
